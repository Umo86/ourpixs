<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Guest · Live feed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,400;1,6..96,500&amp;family=Inter+Tight:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ph-hero{background-image:url(/_blob/c6622c34eb70632c3aade0a7ece552ee);background-size:cover;background-position:center}
.ph-dance{background-image:url(/_blob/4cfb412bbb7e051ef2f10f106b1f89f3);background-size:cover;background-position:center}
.ph-bday{background-image:url(/_blob/97d63e98132419ddc103e975c8f7c209);background-size:cover;background-position:center}
.ph-halay{background-image:url(/_blob/147ed7862285067a80c092230de5c5bc);background-size:cover;background-position:center}
.ph-house{background-image:url(/_blob/4ebb2395bfc817220c235fe6a673c5e6);background-size:cover;background-position:center}
a{color:#8097FF}a:hover{color:#B3C0FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0A0A0A; color: #FFFFFF; font-family: 'Inter Tight', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
  <header style="padding: 18px 20px 12px; display: flex; justify-content: space-between; align-items: center;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 12px; color: #A8ACB8;">Hi Ayşe · Wedding day</span>
      <h1 style="margin: 0; font-size: 26px; font-weight: 900; letter-spacing: -1px;">Elif <span style="font-family: 'Bodoni Moda', Didot, serif; font-style: italic; font-weight: 400; color: #8097FF;">&amp;</span> Can</h1>
    </div>
    <span style="display: flex; align-items: center; gap: 8px; background: #15171F; border-radius: 999px; padding: 9px 14px; font-size: 13px; font-weight: 700;"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #4D6BFF;"></span>Live · 1,284</span>
  </header>

  <div role="group" aria-label="Filter" style="display: flex; gap: 8px; padding: 4px 20px 14px; overflow: hidden;">
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
      <button type="button" aria-pressed="{{f.pressed}}" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
    </sc-for>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 0 20px; display: flex; flex-direction: column; gap: 14px;">
    <article style="border-radius: 28px; overflow: hidden; background: #15171F;">
      <div role="img" aria-label="Photo by Mert: guests dancing the halay" class="ph-halay" style="height: 330px; background-color: #1B2440; display: flex; flex-direction: column; justify-content: space-between; padding: 14px; box-sizing: border-box;">
        <div style="display: flex; justify-content: space-between;">
          <span style="background: #FFFFFF; color: #0A0A0A; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 999px;">Halay</span>
          <span style="background: rgba(10,10,10,0.6); font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 999px;">Just now</span>
        </div>
        <span style="align-self: flex-start; background: #2347E0; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 999px; transform: rotate(-3deg);">On the big screen now</span>
      </div>
      <div style="padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 50%; background: #2347E0; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px;">M</span>
          <span style="font-size: 15px; font-weight: 700;">Mert</span>
        </div>
        <div style="display: flex; gap: 8px;">
          <button type="button" aria-pressed="{{likedStr}}" aria-label="Love this photo" onClick="{{toggleLike}}" style="{{likeStyle}}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="{{heartFill}}" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.500-9.5 9-9.5 9z"/></svg>{{likes}}
          </button>
          <button type="button" aria-label="Download photo" style="min-width: 44px; min-height: 44px; border: 0; border-radius: 999px; background: #23262F; color: #FFFFFF; display: flex; align-items: center; justify-content: center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"/></svg>
          </button>
        </div>
      </div>
    </article>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="6">
        <div role="img" aria-label="{{t.alt}}" style="{{t.style}}">
          <span style="font-size: 11px; font-weight: 700;">{{t.who}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Tabs" style="margin: 10px 14px 14px; background: #15171F; border-radius: 999px; padding: 8px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center;">
    <a href="Guest-Feed.dc.html" aria-current="page" style="min-height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #FFFFFF; color: #0A0A0A; text-decoration: none; font-size: 12px; font-weight: 800;">Feed</a>
    <a href="Guest-Challenges.dc.html" style="min-height: 48px; display: flex; align-items: center; justify-content: center; color: #C8CAD2; text-decoration: none; font-size: 12px; font-weight: 600;">Missions</a>
    <a href="Guest-Upload.dc.html" aria-label="Add photos and videos" style="justify-self: center; width: 52px; height: 52px; border-radius: 50%; background: #2347E0; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 500;">+</a>
    <a href="Guest-Camera.dc.html" style="min-height: 48px; display: flex; align-items: center; justify-content: center; color: #C8CAD2; text-decoration: none; font-size: 12px; font-weight: 600;">Camera</a>
    <a href="Guest-Guestbook.dc.html" style="min-height: 48px; display: flex; align-items: center; justify-content: center; color: #C8CAD2; text-decoration: none; font-size: 12px; font-weight: 600;">Book</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { f: 'all', liked: false };
  }
  renderVals() {
    const chip = 'min-height: 40px; padding: 0 16px; border-radius: 999px; font: inherit; font-size: 13px; font-weight: 700; white-space: nowrap; cursor: pointer;';
    const filters = [['all', 'All'], ['mine', 'Mine'], ['video', 'Videos'], ['halay', 'Halay'], ['top', 'Top']].map(([id, label]) => {
      const on = this.state.f === id;
      return { label, pressed: on ? 'true' : 'false', pick: () => this.setState({ f: id }),
        style: chip + (on ? ' border: 1.5px solid #2347E0; background: #2347E0; color: #FFFFFF;' : ' border: 1.5px solid #3A3F52; background: transparent; color: #FFFFFF;') };
    });
    const tones = ['#2347E0', '#5A6380', '#23262F', '#16309F', '#3A3F52', '#1B2440'];
    const who = ['Zeynep', 'Burak', 'Selin', 'Hakan', 'Derya', 'Ömer'];
    const tiles = who.map((w, i) => ({ who: w, alt: 'Photo by ' + w,
      style: 'aspect-ratio: 1; border-radius: 16px; background: ' + tones[i] + '; display: flex; align-items: flex-end; padding: 8px; box-sizing: border-box;' }));
    const liked = this.state.liked;
    return {
      filters, tiles, likes: liked ? 25 : 24, likedStr: liked ? 'true' : 'false', heartFill: liked ? 'currentColor' : 'none',
      toggleLike: () => this.setState({ liked: !liked }),
      likeStyle: 'min-height: 44px; padding: 0 14px; border: 0; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: pointer;' + (liked ? ' background: #2347E0; color: #FFFFFF;' : ' background: #23262F; color: #FFFFFF;')
    };
  }
}
</script>
</body>
</html>
