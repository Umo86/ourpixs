<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Guest · Photo missions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,400;1,6..96,500&amp;family=Inter+Tight:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8097FF}a:hover{color:#B3C0FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0A0A0A; color: #FFFFFF; font-family: 'Inter Tight', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">
  <header style="padding: 18px 20px 10px; display: flex; flex-direction: column; gap: 6px;">
    <h1 style="margin: 0; font-size: 34px; font-weight: 900; letter-spacing: -1.5px; line-height: 1;">Photo <span style="font-family: 'Bodoni Moda', Didot, serif; font-style: italic; font-weight: 400; color: #8097FF;">missions</span></h1>
    <span style="font-size: 14px; color: #C8CAD2;">Elif &amp; Can set these for you. Snap them all.</span>
  </header>

  <div style="margin: 6px 20px 0; background: #2347E0; border-radius: 24px; padding: 18px; display: flex; align-items: center; justify-content: space-between; gap: 14px;">
    <div style="display: flex; flex-direction: column; gap: 8px; flex: 1;">
      <span style="font-size: 15px; font-weight: 800;">{{doneCount}} of 6 done</span>
      <div style="height: 8px; background: #16309F; border-radius: 999px; overflow: hidden;"><div style="height: 100%; background: #FFFFFF; border-radius: 999px; width: {{pct}};"></div></div>
    </div>
    <span style="background: #FFFFFF; color: #2347E0; font-size: 13px; font-weight: 800; padding: 9px 14px; border-radius: 999px; transform: rotate(4deg);">You're #4</span>
  </div>

  <ul style="flex: 1; margin: 0; padding: 14px 20px 0; list-style: none; display: flex; flex-direction: column; gap: 8px; overflow: hidden;">
    <sc-for list="{{missions}}" as="m" hint-placeholder-count="6">
      <li style="{{m.style}}">
        <span aria-hidden="true" style="{{m.dot}}">{{m.mark}}</span>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 16px; font-weight: 800; letter-spacing: -0.3px;">{{m.title}}</span>
          <span style="font-size: 12.5px; opacity: 0.75;">{{m.sub}}</span>
        </div>
        <button type="button" aria-pressed="{{m.pressed}}" onClick="{{m.toggle}}" style="{{m.btn}}">{{m.cta}}</button>
      </li>
    </sc-for>
  </ul>

  <div style="margin: 10px 20px 0; display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: #C8CAD2;">
    <span>Top snapper tonight: <strong style="color: #FFFFFF;">Zeynep · 6 of 6</strong></span>
    <a href="#leaderboard" style="font-weight: 700;">Leaderboard</a>
  </div>

  <nav aria-label="Tabs" style="margin: 10px 14px 14px; background: #15171F; border-radius: 999px; padding: 8px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center;">
    <a href="Guest-Feed.dc.html" style="min-height: 48px; display: flex; align-items: center; justify-content: center; color: #C8CAD2; text-decoration: none; font-size: 12px; font-weight: 600;">Feed</a>
    <a href="Guest-Challenges.dc.html" aria-current="page" style="min-height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #FFFFFF; color: #0A0A0A; text-decoration: none; font-size: 12px; font-weight: 800;">Missions</a>
    <a href="Guest-Upload.dc.html" aria-label="Add photos and videos" style="justify-self: center; width: 52px; height: 52px; border-radius: 50%; background: #2347E0; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 500;">+</a>
    <a href="Guest-Camera.dc.html" style="min-height: 48px; display: flex; align-items: center; justify-content: center; color: #C8CAD2; text-decoration: none; font-size: 12px; font-weight: 600;">Camera</a>
    <a href="Guest-Guestbook.dc.html" style="min-height: 48px; display: flex; align-items: center; justify-content: center; color: #C8CAD2; text-decoration: none; font-size: 12px; font-weight: 600;">Book</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: { a: true, b: true, c: true } };
  }
  renderVals() {
    const list = [
      ['a', 'Selfie with the bride or groom', '42 guests did it'],
      ['b', 'Your whole table, one frame', '31 guests did it'],
      ['c', 'Best halay face', '58 guests did it'],
      ['d', 'The oldest and youngest guest together', '9 guests did it'],
      ['e', 'Someone crying happy tears', '14 guests did it'],
      ['f', 'A 10-second video message', '27 guests did it']
    ];
    const done = this.state.done;
    const missions = list.map(([id, title, sub]) => {
      const on = !!done[id];
      return {
        title, sub, pressed: on ? 'true' : 'false', mark: on ? '✓' : '', cta: on ? 'Done' : 'Snap it',
        toggle: () => this.setState({ done: { ...done, [id]: !on } }),
        style: 'display: flex; align-items: center; gap: 12px; border-radius: 20px; padding: 12px 12px 12px 14px;' + (on ? ' background: #15171F; color: #FFFFFF;' : ' background: #FFFFFF; color: #0A0A0A;'),
        dot: 'width: 28px; height: 28px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800;' + (on ? ' background: #2347E0; color: #FFFFFF;' : ' border: 2px solid #0A0A0A; box-sizing: border-box;'),
        btn: 'min-height: 44px; padding: 0 16px; border-radius: 999px; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer;' + (on ? ' border: 1.5px solid #3A3F52; background: transparent; color: #C8CAD2;' : ' border: 0; background: #2347E0; color: #FFFFFF;')
      };
    });
    const n = missions.filter((m) => m.pressed === 'true').length;
    return { missions, doneCount: n, pct: Math.round((n / 6) * 100) + '%' };
  }
}
</script>
</body>
</html>
