<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>QR table card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&amp;family=Inter+Tight:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 397px; height: 559px; box-sizing: border-box; background: #FFFFFF; color: #0A0A0A; font-family: 'Inter Tight', system-ui, sans-serif; padding: 28px 30px 22px; display: flex; flex-direction: column; align-items: center; text-align: center;">
  <span style="font-size: 10px; letter-spacing: 3px; text-transform: uppercase;">Düğün · 14.06.2027</span>
  <h1 style="margin: 10px 0 0; font-family: 'Bodoni Moda', Didot, serif; font-weight: 400; font-size: 48px; line-height: 0.95; letter-spacing: -1px;">Elif <em>&amp;</em> Can</h1>
  <div style="width: 100%; height: 2px; background: #2347E0; margin: 18px 0;"></div>
  <div role="img" aria-label="QR kod" style="width: 176px; height: 176px; display: grid; grid-template-columns: repeat(21, minmax(0, 1fr));">
    <sc-for list="{{cells}}" as="c" hint-placeholder-count="441">
      <div style="background: {{c.bg}};"></div>
    </sc-for>
  </div>
  <p style="margin: 18px 0 0; font-family: 'Bodoni Moda', Didot, serif; font-style: italic; font-size: 22px; line-height: 1.2; color: #2347E0;">Kareleriniz bizimle kalsın.</p>
  <p style="margin: 8px 0 0; font-size: 12px; line-height: 1.5; color: #3A3A3A;">QR'ı okutun, fotoğraf ve videolarınızı yükleyin. Uygulama gerekmez.<br>Scan to share your photos. No app needed.</p>
  <div style="width: 100%; height: 2px; background: #2347E0; margin-top: auto;"></div>
  <span style="margin-top: 10px; font-family: 'Bodoni Moda', Didot, serif; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: #2347E0;">Bizim Resimler</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":397,"height":559}}'>
class Component extends DCLogic {
  renderVals() {
    const n = 21;
    const finder = (r, c) => {
      const spots = [[0, 0], [0, n - 7], [n - 7, 0]];
      for (const [fr, fc] of spots) {
        const y = r - fr, x = c - fc;
        if (y >= 0 && y < 7 && x >= 0 && x < 7) {
          const edge = y === 0 || y === 6 || x === 0 || x === 6;
          const core = y >= 2 && y <= 4 && x >= 2 && x <= 4;
          return edge || core ? 1 : 0;
        }
        if (y >= -1 && y <= 7 && x >= -1 && x <= 7) return 0;
      }
      return -1;
    };
    const cells = [];
    let seed = 7;
    for (let r = 0; r < n; r++) {
      for (let c = 0; c < n; c++) {
        const f = finder(r, c);
        seed = (seed * 9301 + 49297) % 233280;
        const on = f === -1 ? seed / 233280 > 0.52 : f === 1;
        cells.push({ bg: on ? '#0A0A0A' : '#FFFFFF' });
      }
    }
    return { cells };
  }
}
</script>
</body>
</html>
